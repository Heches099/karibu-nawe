name: farm_fms
description: "Farm Work Measurement, Payment & Collection Accountability System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Persistence - works on Android, Web (IndexedDB) and desktop.
  sembast: ^3.8.4
  sembast_web: ^2.4.0+4
  path_provider: ^2.1.5
  path: ^1.9.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2

  # State management
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true