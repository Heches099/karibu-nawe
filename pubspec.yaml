name: farm_fms
description: "Farm Work Measurement, Payment & Collection Accountability System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Persistence - works on Android, Web (IndexedDB) and desktop.
  sembast: ^3.8.4
  sembast_web: ^2.4.0+4
  path_provider: ^2.1.5
  path: ^1.9.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2

  # State management
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icons/icon1.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#2E7D32"
  adaptive_icon_foreground: "assets/icons/icon1.jpg"
  web:
    generate: true
    image_path: "assets/icons/icon1.jpg"
    background_color: "#2E7D32"
    theme_color: "#2E7D32"
  windows:
    generate: true
    image_path: "assets/icons/icon1.jpg"
    icon_size: 48

flutter_native_splash:
  color: "#2E7D32"
  image: assets/icons/icon1.jpg
  android_12:
    color: "#2E7D32"
    image: assets/icons/icon1.jpg
    icon_background_color: "#2E7D32"
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/