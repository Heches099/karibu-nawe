name: farm_system
description: Farm Work Measurement, Worker Allocation, Payment, Collection & Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Persistence — real embedded database, works on Android/iOS/Web/Desktop
  # with zero native setup and no code generation step required.
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State management — simple, explicit, easy to read/extend.
  provider: ^6.1.2

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
